# As faixas abaixo sao obrigatorias: sem elas o nginx aceitaria um
# CF-Connecting-IP forjado por qualquer um, e o atacante escolheria o proprio
# IP. Pior que nao ter.
#
# Fonte: cloudflare.com/ips-v4 e /ips-v6, buscadas em 13/10/2026.
# ============================================================================
