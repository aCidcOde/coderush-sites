#
# A cadeia e Cloudflare -> nginx do host (:443) -> container coderush (:8081).
# Sem isto o $remote_addr do host e o IP do Cloudflare, e era esse endereco
# que ia no X-Real-IP pro container e no log. Resultado: nenhum lead do
# leads.sqlite tinha IP util desde agosto — todos gravavam 172.21.0.1, o
# gateway do Docker.
#
# Em 11/10 um robo fez 59 cliques e queimou R$ 53,75 em seis horas. Deu pra
# detectar pela frequencia, mas nao pra bloquear a origem nem pra abrir
# reclamacao de clique invalido no Google com evidencia.
