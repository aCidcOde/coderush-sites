# BFR Intelligence — site estatico (posts gerados pelo blog-bot; api.php aposentada)
server {
    listen 80;
    server_name bfrintelligence.com.br www.bfrintelligence.com.br;
    root /var/www/html/bfrintelligence;
    index index.html;

    location ^~ /data/ { deny all; }
    location ^~ /storage/ { deny all; }
    location = /api.php { return 410; }

    # PHP e liberado item a item, nunca por ~ \.php$: o location / cai em
    # try_files, entao qualquer .php nao listado aqui seria SERVIDO COMO TEXTO —
    # vazando o codigo em vez de executa-lo. Ao adicionar endpoint novo, adicione
    # o location junto.
    location = /enviar-contato.php {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # beacon do clique de WhatsApp (desde 12/09/2026, com a campanha paga)
    location = /zap-lead.php {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # compat: URLs antigas /conteudos/artigo.html?slug=X -> pagina estatica datada
    # (host absoluto em https pra nao gerar hop extra atras do proxy do host)
    location = /conteudos/artigo.html {
        if ($bfr_artigo_destino != "") { return 301 https://bfrintelligence.com.br$bfr_artigo_destino; }
        return 301 https://bfrintelligence.com.br/conteudos/;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\.(?!well-known).* { deny all; }
}

# FluxoInteligente IA — descontinuado em 2026-08: marca absorvida pela BFR Intelligence.
# Tudo responde 301 pra bfrintelligence.com.br, EXCETO as capas de posts em /imagens/posts/,
# que continuam servindo porque os artigos migrados na BFR referenciam essas URLs.
server {
    listen 80;
    server_name fluxointeligenteia.com.br www.fluxointeligenteia.com.br;
    root /var/www/html/fluxointeligenteia;

    location ^~ /imagens/posts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Slugs duplicados ganharam sufixo na deduplicacao da BFR — mapeamento exato por data.
    location ~ ^/2026/05/12/implementar-agentes-corporativos-ia-governanca/?$ {
        return 301 https://bfrintelligence.com.br/2026/05/12/implementar-agentes-corporativos-ia-governanca-2/;
    }
    location ~ ^/2026/05/27/permissoes-auditoria-agentes-corporativos-ia/?$ {
        return 301 https://bfrintelligence.com.br/2026/05/27/permissoes-auditoria-agentes-corporativos-ia-2/;
    }
    location ~ ^/2026/06/03/permissoes-auditoria-agentes-corporativos-ia/?$ {
        return 301 https://bfrintelligence.com.br/2026/06/03/permissoes-auditoria-agentes-corporativos-ia-3/;
    }

    # Posts do blog antigo -> artigo correspondente na BFR
    location ~ "^/\d{4}/\d{2}/\d{2}/(?<postslug>[^/]+)/?$" {
        return 301 https://bfrintelligence.com.br$request_uri;
    }

    # Indice do blog antigo -> listagem de conteudos
    location ~ ^/blog(/.*)?$ {
        return 301 https://bfrintelligence.com.br/conteudos/;
    }

    # Sitemap/robots antigos apontam pros novos
    location = /sitemap.xml { return 301 https://bfrintelligence.com.br/sitemap.xml; }
    location = /robots.txt  { return 301 https://bfrintelligence.com.br/robots.txt; }

    # Qualquer outra rota (institucionais /agentes-corporativos/, /link/, /v3/,
    # 404s antigos): vai pra home da BFR. Preservar o path aqui geraria 301 -> 404.
    location / {
        return 301 https://bfrintelligence.com.br/;
    }
}
