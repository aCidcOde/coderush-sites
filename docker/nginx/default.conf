# CodeRush Hub (raiz)
server {
    listen 80;
    server_name coderush.com.br www.coderush.com.br coderush.sistemavendadireta.com.br localhost;
    root /var/www/html;

    location ^~ /storage/ {
        deny all;
    }

    index index.php index.html;

    location ^~ /wordpressconsultoria/ {
        return 410;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# Sistema Venda Direta
server {
    listen 80;
    server_name sistemavendadireta.com.br www.sistemavendadireta.com.br;
    root /var/www/html/sistemavendadireta;

    location ^~ /storage/ {
        deny all;
    }

    index index.php index.html;

    # /oferta/ MORREU e virou /sistema-venda-direta/ (14/09/2026).
    #
    # O endereco antigo nomeava a promocao; o novo nomeia o produto, que e o que
    # a pessoa busca. A promocao acaba em 30/09 — a URL nao pode acabar junto.
    #
    # 301 preserva o que ja foi acumulado: link em anuncio, e-mail, WhatsApp e o
    # que o Google ja conhece. E precisa ser 301 e nao 302: so o permanente
    # transfere sinal pro endereco novo.
    #
    # O ^~ pega a arvore inteira, entao /oferta/afiliados/ cai em
    # /sistema-venda-direta/afiliados/ — sem isso as sub-LPs virariam 404.
    # rewrite e nao return: location ^~ e prefixo puro, nao captura grupo — com
    # return o $1 sairia vazio e TODA sub-LP cairia na raiz da nova arvore.
    location ^~ /oferta/ {
        rewrite ^/oferta/(.*)$ https://sistemavendadireta.com.br/sistema-venda-direta/$1 permanent;
    }
    location = /oferta { return 301 https://sistemavendadireta.com.br/sistema-venda-direta/; }

    # Apelidos que uma pessoa (ou link de fora) tentaria. Antes apontavam pra
    # home; agora a LP tem endereco proprio e e ela quem recebe.
    location = /venda-direta/            { return 301 https://sistemavendadireta.com.br/sistema-venda-direta/; }
    location = /venda-direta             { return 301 https://sistemavendadireta.com.br/sistema-venda-direta/; }
    location = /plataforma-venda-direta/ { return 301 https://sistemavendadireta.com.br/sistema-venda-direta/; }
    location = /plataforma-venda-direta  { return 301 https://sistemavendadireta.com.br/sistema-venda-direta/; }

    # /codafacil/ nunca existiu DENTRO do SVD — o CodaFacil e outro site, em
    # dominio proprio. A home linkava pra ca com caminho relativo e o soft-404
    # devolvia a propria home com 200: quem clicava em "Desenvolvimento com IA"
    # voltava pro comeco sem perceber. Os links internos foram corrigidos pro
    # dominio certo; este 301 cobre quem ja linkou de fora e o que o Google
    # possa ter indexado.
    location ^~ /codafacil { return 301 https://codafacil.dev; }

    location / {
        # ANTES: try_files $uri $uri/ /index.php?$query_string
        # Aquele fallback servia a HOME, com status 200, pra QUALQUER caminho
        # inventado — /xpto-nao-existe/ e /asdfgh/qwerty/ devolviam a home
        # inteira. E soft-404 em infinitas URLs: o Google rastreia, encontra
        # conteudo duplicado e gasta orcamento de rastreamento em endereco que
        # nao existe. O canonical mitigava, nao resolvia.
        #
        # Este site nao tem front controller: cada pagina e um diretorio com
        # index.php de verdade. Entao $uri e $uri/ dao conta, e o que sobra deve
        # mesmo ser 404.
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

