# CodeRush Hub (raiz)
server {
    listen 80;
    server_name coderush.com.br www.coderush.com.br coderush.sistemavendadireta.com.br localhost;
    root /var/www/html;

    location ^~ /storage/ {
        deny all;
    }

    index index.php index.html;

    location ^~ /wordpressconsultoria/ {
        return 410;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

