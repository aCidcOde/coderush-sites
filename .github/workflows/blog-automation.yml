name: Blog Automation

on:
  schedule:
    # A cada 3 dias as 10:00 UTC (07:00 America/Sao_Paulo).
    # GitHub Actions nao suporta intervalo de N dias direto; usamos dias do mes
    # multiplos de 3 (3,6,9,...,30). Ciclo se repete a cada 3 dias com pulo
    # ocasional no virar de mes — aceitavel para cadencia editorial.
    - cron: "0 10 3,6,9,12,15,18,21,24,27,30 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-post-drafts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Install image processing toolchain (Pillow + tesseract)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pil tesseract-ocr

      - name: Run blog bot
        env:
          API_OPENROUTER: ${{ secrets.API_OPENROUTER }}
          BLOG_BOT_OPENROUTER_MODEL: openai/gpt-4o-mini
          BLOG_BOT_OPENROUTER_IMAGE_MODEL: google/gemini-2.5-flash-image
          BLOG_BOT_PROMPT_MODEL: anthropic/claude-sonnet-4-6
          BLOG_API_TOKEN_EMERGENCY: ${{ secrets.BLOG_API_TOKEN_EMERGENCY }}
        run: npm run blogbot:publish

      - name: Create automated PR
        id: create_pr
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(blog): publicar conteudo multi-site"
          branch: "automation/blog-${{ github.run_id }}"
          title: "Automacao de posts: publicacao multi-site"
          body: |
            ## Resumo
            - Executa o robô a cada 3 dias para `coderush`, `codafacil`, `fluxointeligenteia` e `sistemavendadireta`
            - Publica posts, atualiza destaques nas homes e mantém `/blog/`, sitemap e robots por site
            - Registra artefatos e relatório em `automation/blog-bot/`

            ## Aprovação manual
            Este PR foi aberto automaticamente e deve ser revisado antes do merge.
          labels: |
            automacao
            blog
