name: Blog Automation

on:
  schedule:
    # Semanal, as 10:00 UTC (07:00 America/Sao_Paulo), nos dias 1, 8, 15 e 22.
    # Era a cada 3 dias ate 05/09/2026. Cadencia alta gerava volume sem retorno:
    # 9 posts indexados renderam 25 impressoes em 30 dias, 1% do dominio. Menos
    # posts, cada um mirando um grupo de busca real, rende mais que publicar
    # por publicar — e sobra tempo pra revisar o que ja esta no ar.
    - cron: "0 10 1,8,15,22 * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  generate-post-drafts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Install image processing toolchain (Pillow + tesseract)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pil tesseract-ocr

      - name: Run blog bot
        id: blogbot
        env:
          API_OPENROUTER: ${{ secrets.API_OPENROUTER }}
          BLOG_BOT_OPENROUTER_MODEL: openai/gpt-4o-mini
          BLOG_BOT_OPENROUTER_IMAGE_MODEL: google/gemini-2.5-flash-image
          BLOG_BOT_PROMPT_MODEL: anthropic/claude-sonnet-4-6
          BLOG_API_TOKEN_EMERGENCY: ${{ secrets.BLOG_API_TOKEN_EMERGENCY }}
          BFR_CONTENT_TOKEN: ${{ secrets.BFR_CONTENT_TOKEN }}
        run: npm run blogbot:publish

      # 05/10/2026 — ROda mesmo quando o bot sai com codigo 1.
      #
      # Sem o `if: always()` este passo era pulado por padrao, e o que ja estava
      # escrito em disco ia pro lixo. Foi exatamente o que aconteceu entre 22/09 e
      # 05/10: o saldo do OpenRouter zerou, a capa do emergency passou a falhar com
      # 402, o run saiu 1 — e os posts do SVD e da BFR, que tinham sido gerados e
      # gravados COM SUCESSO, nunca foram commitados. 13 dias sem publicar por
      # causa de um site de tres.
      #
      # `git add -A` so pega o que existe: se nada foi gerado, o passo detecta e sai
      # sem commitar. Entao rodar sempre nao publica lixo — so impede que a falha de
      # um destino apague o trabalho dos outros.
      - name: Commit and push to main
        if: always()
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao gerada pelo bot — nada a commitar."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(blog): publicar conteudo multi-site (run ${{ github.run_id }})"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Deploy workflow
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main --repo ${{ github.repository }}

      - name: Build email summary
        if: always()
        id: email
        env:
          BLOGBOT_OUTCOME: ${{ steps.blogbot.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node automation/blog-bot/scripts/build-email-summary.js

      - name: Send email report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ steps.email.outputs.subject }}
          to: acidkp@gmail.com
          from: Blog Bot Coderush <${{ secrets.MAIL_USERNAME }}>
          body: file://automation/blog-bot/reports/last-email-body.txt
          convert_markdown: false
