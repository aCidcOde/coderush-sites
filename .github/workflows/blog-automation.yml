name: Blog Automation

on:
  schedule:
    # A cada 3 dias as 10:00 UTC (07:00 America/Sao_Paulo).
    # GitHub Actions nao suporta intervalo de N dias direto; usamos dias do mes
    # multiplos de 3 (3,6,9,...,30). Ciclo se repete a cada 3 dias com pulo
    # ocasional no virar de mes — aceitavel para cadencia editorial.
    - cron: "0 10 3,6,9,12,15,18,21,24,27,30 * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  generate-post-drafts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Install image processing toolchain (Pillow + tesseract)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pil tesseract-ocr

      - name: Run blog bot
        id: blogbot
        env:
          API_OPENROUTER: ${{ secrets.API_OPENROUTER }}
          BLOG_BOT_OPENROUTER_MODEL: openai/gpt-4o-mini
          BLOG_BOT_OPENROUTER_IMAGE_MODEL: google/gemini-2.5-flash-image
          BLOG_BOT_PROMPT_MODEL: anthropic/claude-sonnet-4-6
          BLOG_API_TOKEN_EMERGENCY: ${{ secrets.BLOG_API_TOKEN_EMERGENCY }}
        run: npm run blogbot:publish

      - name: Commit and push to main
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao gerada pelo bot — nada a commitar."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(blog): publicar conteudo multi-site (run ${{ github.run_id }})"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Deploy workflow
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main --repo ${{ github.repository }}

      - name: Build email summary
        if: always()
        id: email
        env:
          BLOGBOT_OUTCOME: ${{ steps.blogbot.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node automation/blog-bot/scripts/build-email-summary.js

      - name: Send email report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ steps.email.outputs.subject }}
          to: andre@sistemavendadireta.com.br
          from: Blog Bot Coderush <${{ secrets.MAIL_USERNAME }}>
          body: file://automation/blog-bot/reports/last-email-body.txt
          convert_markdown: false
