name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH bootstrap — fetch + reset --hard
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$SSH_USER@$SSH_HOST" \
            "cd /data/coderush-sites && git fetch origin main && git reset --hard origin/main && git status --short && git rev-parse HEAD"

      - name: Trigger deploy webhook
        run: |
          set -o pipefail
          body=$(mktemp)
          http=$(curl -sS -o "$body" -w "%{http_code}" \
            -X POST https://coderush.com.br/deploy.php \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}")

          echo "HTTP $http"
          echo "--- response body ---"
          cat "$body"
          echo "--- end body ---"

          if [ "$http" != "200" ]; then
            echo "::error::Deploy webhook retornou HTTP $http"
            exit 1
          fi
