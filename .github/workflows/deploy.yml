name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$SSH_USER@$SSH_HOST" bash -s <<'REMOTE'
          set -e
          cd /data/coderush-sites

          echo "=== whoami / pwd ==="
          whoami
          pwd

          echo "=== git fetch ==="
          git fetch origin main

          echo "=== git reset --hard origin/main ==="
          git reset --hard origin/main

          echo "=== HEAD ==="
          git rev-parse HEAD

          if [ -f composer.json ]; then
            echo "=== composer install ==="
            composer install --no-dev --no-interaction --optimize-autoloader --no-progress || echo "composer falhou (nao critico pra sites estaticos)"
          fi

          if [ -f package.json ]; then
            echo "=== npm run build:css ==="
            npm run build:css
          fi

          if [ -f docker-compose.yml ] || [ -f compose.yml ]; then
            echo "=== docker compose restart ==="
            docker compose restart || echo "docker restart falhou (nao critico se nginx serve direto do disco)"
          fi

          echo "=== deploy ok ==="
          REMOTE
