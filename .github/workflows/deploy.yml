name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy webhook
        run: |
          set -o pipefail
          body=$(mktemp)
          http=$(curl -sS -o "$body" -w "%{http_code}" \
            -X POST https://coderush.com.br/deploy.php \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}")

          echo "HTTP $http"
          echo "--- response body ---"
          cat "$body"
          echo "--- end body ---"

          if [ "$http" != "200" ]; then
            echo "::error::Deploy webhook retornou HTTP $http"
            exit 1
          fi
