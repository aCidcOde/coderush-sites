<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Redirecionando… | BFR Intelligence</title>
  <meta name="robots" content="noindex">
  <script>
    // Compatibilidade com as URLs antigas /conteudos/artigo.html?slug=X
    // O mapa slug->pagina definitiva fica no nginx; este fallback cobre acesso direto ao arquivo.
    var slug = new URLSearchParams(location.search).get("slug");
    location.replace(slug ? "/conteudos/#" + slug : "/conteudos/");
  </script>
</head>
<body><p>Redirecionando pra <a href="/conteudos/">Conteúdos</a>…</p></body>
</html>
